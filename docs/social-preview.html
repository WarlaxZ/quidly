<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --forest: #1f3d30;
    --ink: #f4f1e6;
    --ochre-lt: #d9a441;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* The page is deliberately taller than the card: headless Chrome leaves the
     last ~80px of the viewport unpainted, so we render with slack below and
     crop the top 1280x640 afterwards. */
  html, body { width: 1280px; height: 820px; background: #000; }

  .card {
    position: relative;
    width: 1280px; height: 640px;
    overflow: hidden;
    background: var(--forest);
    color: var(--ink);
    font-family: "Hanken Grotesk", sans-serif;
  }

  /* Faint ledger rules — the accounting-paper cue from the app's .ledger table. */
  .rules {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 55px,
      rgba(244, 241, 230, 0.045) 55px 56px
    );
  }
  /* Warm light from the top-left, so the flat green reads as lit rather than dead. */
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 6% -10%, rgba(179, 119, 31, 0.20) 0%, transparent 55%),
      radial-gradient(80% 70% at 100% 115%, rgba(43, 87, 69, 0.85) 0%, transparent 60%);
  }

  .frame {
    position: absolute; inset: 0;
    padding: 62px 76px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .lockup { display: flex; align-items: center; gap: 26px; }
  .badge {
    width: 98px; height: 98px; border-radius: 26px;
    background: var(--ink); color: var(--forest);
    font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 62px;
    line-height: 1; display: flex; align-items: center; justify-content: center;
    padding-bottom: 6px;
    box-shadow: 0 18px 44px -18px rgba(0, 0, 0, 0.55);
  }
  .wordmark {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600; font-size: 76px; letter-spacing: -0.025em; line-height: 1;
  }
  .repo {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 19px; color: rgba(244, 241, 230, 0.58);
    white-space: nowrap;
  }

  .tagline {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600; font-size: 62px; letter-spacing: -0.022em; line-height: 1.06;
  }
  .rule {
    width: 84px; height: 5px; border-radius: 3px;
    background: var(--ochre-lt); margin: 24px 0 22px;
  }
  .sub {
    font-size: 28px; font-weight: 400; line-height: 1.4;
    color: rgba(244, 241, 230, 0.82); max-width: 44ch;
  }

  .chips { display: flex; gap: 11px; }
  .chip {
    border: 1px solid rgba(244, 241, 230, 0.26);
    background: rgba(244, 241, 230, 0.07);
    border-radius: 999px; padding: 9px 18px;
    font-size: 19px; font-weight: 500; letter-spacing: 0.005em;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rules"></div>
    <div class="glow"></div>

    <div class="frame">
      <div class="top">
        <div class="lockup">
          <div class="badge">£</div>
          <div class="wordmark">Quidly</div>
        </div>
        <div class="repo">github.com/WarlaxZ/quidly</div>
      </div>

      <div class="mid">
        <div class="tagline">Self-Assessment, sorted.</div>
        <div class="rule"></div>
        <div class="sub">Free, self-hosted bookkeeping&nbsp;&amp; tax for UK landlords.</div>
      </div>

      <div class="chips">
        <div class="chip">SA105 &amp; PDF export</div>
        <div class="chip">Section 24 relief</div>
        <div class="chip">Multi-property</div>
        <div class="chip">Limited companies</div>
        <div class="chip">Docker</div>
      </div>
    </div>
  </div>
</body>
</html>
